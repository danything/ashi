name: Check

on:
  pull_request:
    # 画像タグを差し替える PR(bump-ashi-image)は deploy/ しか変えない。作られてすぐ自動で
    # マージされてブランチが消えるので、起動しても中身の無いまま「ワークフローの問題」で赤くなっていた。
    # deploy/ だけの PR では起動しない(見るもの=コードが無い)
    paths-ignore: ["deploy/**"]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# 警告もエラーも落とす: biome は --error-on-warnings、svelte-check は --fail-on-warnings、
# ビルドは vite.config.ts で警告を失敗に
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun i --frozen-lockfile
      - run: bunx biome ci --error-on-warnings
      - run: bunx svelte-kit sync && bunx svelte-check --tsconfig ./tsconfig.json --tsgo --fail-on-warnings
      - run: bun test tests
      - run: bun run build
