apiVersion: apps/v1
kind: Deployment
metadata:
  name: ashi
  namespace: ashi
  annotations:
    # 参照している Secret を Infisical operator が同期したら、自動でローリング再起動する
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  # **Recreate。2 つの Pod を同時に立てない。** 画面のサーバーが歩みも回していて、状態ファイルを
  # 書くのは 1 プロセスだけという前提(walk.lock)。ロックは pid で見るので、Pod をまたぐと
  # 相手が生きているか分からず、入れ替わりの間に 2 つが同時に歩いて状態を書き合う。
  # 入れ替わりの数秒は画面が落ちるが、持ち主しか見ないので構わない
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ashi
  template:
    metadata:
      labels:
        app: ashi
    spec:
      # イメージは uid 1000 (bun) で動く。ボリュームをその group に揃える
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: ashi
          image: ghcr.io/danything/ashi:a82a24014aef633cdacb2253a5e67557893ad962
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            failureThreshold: 6
          env:
            # 公開の URL。Entra のリダイレクト URI(/auth/callback)と、通知に付ける /blocked のリンクに使う
            - name: ORIGIN
              value: https://as.doany.io
            - name: ASHI_HOME
              value: /data
            # 1 日の区切り(予算・歩数・日記の日付)を日本の 0 時にする。無いと UTC で、朝 9 時に切り替わっていた
            - name: TZ
              value: Asia/Tokyo
            # 止めるとき、処理中の要求を待つ上限(秒、adapter-node)。既定の 30 秒だと Gateway との
            # keep-alive の接続が残って待ち切ることがある。対話の返事を待たせている途中なら切れる
            - name: SHUTDOWN_TIMEOUT
              value: "10"
            # 足跡の Forgejo はクラスタの中の Service へ直接行く(ノードから Gateway の 443 に折り返せないため)。
            # 人が決めた宛先なので、プライベートアドレスでも読む(頭の fetch_url は読まない)
            - name: FORGEJO_URL
              value: http://forgejo-web.forgejo.svc:3000
            # ashi.json の上に重ねる設定(config.ts)。頭は Claude Code の CLI をサブスクで(Opus 5.5)、
            # 1 日 30 歩まで。サブスクはドルで測れないので budget は効かない(API キーに戻すと効く)。
            # model も書くのは、PVC の ashi.json が作ったときの既定を持っているため
            - name: ASHI_CONFIG
              value: >-
                {"head":"claude-code","model":"claude-opus-5-5","maxStepsPerDay":30,"budget":{"dailyUsd":5,"stepUsd":1},"x":{"enabled":true,"dailyUsd":1,"maxPostsPerDay":3,"maxRepliesPerDay":10,"mentionsEveryMinutes":60}}
            # 持ち主の足跡。いつ読むかは頭が決める。鍵の要るもの(X・Forgejo)は鍵が無ければ /blocked に出る
            - name: ASHI_FEEDS
              value: >-
                [{"id":"blog","kind":"rss","target":"https://doany.io/rss.xml","title":"ブログ"},
                {"id":"github","kind":"github","target":"5ym","title":"GitHub"},
                {"id":"forgejo","kind":"forgejo","target":"yui","title":"Forgejo"},
                {"id":"x","kind":"x","target":"5yuim","title":"X"}]
            # 頭(head: claude-code)。`claude setup-token` で出すサブスクのトークン
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: claude-code-oauth-token
            # Entra ID は doany.io の共有のアプリ登録 Main(oauth2-proxy・ArgoCD・Headlamp と同じ)。
            # ID は秘密ではないので平文。リダイレクト URI https://as.doany.io/auth/callback は Main に登録済み。
            # 通すのはアプリロール admin を割り当てられた人だけ(ENTRA_ROLE の既定)
            - name: ENTRA_TENANT_ID
              value: 22ac977d-b140-4dc8-8150-90d645d3475b
            - name: ENTRA_CLIENT_ID
              value: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: entra-client-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: session-secret
            # ここから下は無くても動く(弾かれたことは /blocked に出る)
            # 頭を head: api(従量課金)に戻すときの API キー
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: anthropic-api-key
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: github-token
                  optional: true
            - name: X_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: x-bearer-token
                  optional: true
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: forgejo-token
                  optional: true
            # Ashi の X アカウント(DoaRetail)をつなぐ X のアプリ。xool(x.doany.io)と同じアプリを参照で使う
            - name: X_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: x-client-id
                  optional: true
            - name: X_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: x-client-secret
                  optional: true
            - name: NOTIFY_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: ashi-secrets
                  key: notify-webhook-url
                  optional: true
          volumeMounts:
            - name: ashi-data
              mountPath: /data
      volumes:
        - name: ashi-data
          persistentVolumeClaim:
            claimName: ashi-data
