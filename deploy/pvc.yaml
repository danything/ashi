# 状態ディレクトリ(ASHI_HOME)。問い・ノート・日記・自己記述・持ち主の地図など、Ashi が歩いて貯めたもの全部。
# バックアップは VolSync が PVC ごとのスナップショットを取る(danything/gitops の deploy/volsync/application.yaml)。
# JSON と Markdown で、書くときは一時ファイルから差し替えるので、途中の形は残らない。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ashi-data
  namespace: ashi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
