# Secret ashi-secrets は Infisical (il.doany.io) のフォルダ /ashi/ashi-secrets にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする。
# 値は Infisical の UI で書き換えるだけ（push-bridge が数秒で同期。auto-reload 注釈のある
# Deployment は自動で入れ替わる）。
#
# 入れる鍵(何をどう取るかは docs/permissions.md):
#   claude-code-oauth-token 必須。頭(Claude Code の CLI をサブスクで)。`claude setup-token` の出力(sk-ant-oat…)
#   anthropic-api-key      任意。頭を head: api(Messages API、従量課金)にするときの API キー(sk-ant-api…)
#   entra-client-secret    必須。値は写さず Infisical の参照で置く:
#                            ${prod.auth.auth-secrets.oidc-client-secret}
#                          (アプリ登録 Main のシークレット。同じ値が 2 か所にあるとローテーションで片方が腐る。
#                           解決に失敗すると ${...} がそのまま入り、Entra が invalid_client を返す)
#   session-secret         必須。32 文字以上の乱数
#   github-token           任意。GitHub の公開イベントを読む回数の上限を上げる
#   x-bearer-token         任意。X を読む(有料の API)
#   forgejo-token          任意。Forgejo(fj.doany.io)の動きを非公開リポジトリも含めて読む(read:user・read:repository)
#   notify-webhook-url     任意。弾かれたことの通知(Mattermost の内向きウェブフック)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ashi-secrets
  namespace: ashi
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /ashi/ashi-secrets
        recursive: false
  managedKubeSecretReferences:
    - secretName: ashi-secrets
      secretNamespace: ashi
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
