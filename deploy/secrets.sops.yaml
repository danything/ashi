# ashi の namespace の秘密。
#   ashi-secrets: 鍵(何をどう取るかは docs/permissions.md)
#     claude-code-oauth-token 必須。頭(Claude Code の CLI をサブスクで)。`claude setup-token` の出力(sk-ant-oat…)
#     anthropic-api-key      任意。頭を head: api(Messages API、従量課金)にするときの API キー(sk-ant-api…)
#     entra-client-secret    必須。Entra の共用のアプリ登録 Main のシークレット(gitops の auth などと同じ値。変えるときは全部)
#     session-secret         必須。32 文字以上の乱数
#     github-token           任意。GitHub の公開イベントを読む回数の上限を上げる
#     x-bearer-token         任意。X を読む(有料の API)
#     forgejo-token          任意。Forgejo(fj.doany.io)の動きを非公開リポジトリも含めて読む(read:user・read:repository)
#     x-client-id / x-client-secret  任意。Ashi の X アカウントをつなぐ X のアプリ(xool の xool-secrets の client-id・client-secret と同じ値)
#     notify-webhook-url     任意。弾かれたことの通知(Mattermost の内向きウェブフック)
#   volsync-<pvc>: VolSync の restic の Secret(danything/gitops の deploy/backup/secrets.sops.yaml と同じ R2 の資格情報とパスワードで、リポジトリだけ PVC ごと)
# 値は SOPS で暗号化してある(../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは管理者の鍵で `sops edit deploy/secrets.sops.yaml` して push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
