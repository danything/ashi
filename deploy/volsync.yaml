# このアプリの PVC を VolSync で R2 に取る(リポジトリは PVC ごとに `<bucket>/volsync/ashi/<pvc>`)。
# 取り方・時刻・Secret の組み方は danything/gitops の deploy/volsync/application.yaml。アプリと一緒に置くので、
# アプリを消せばこれも消える(R2 のリポジトリは残る。要らなければ gitops の deploy/backup/README.md「やめる」)。
# PVC を足したら、下の managedKubeSecretReferences と ReplicationSource を 1 組足す。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: volsync
  namespace: ashi
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /backup/backup
        recursive: false
  managedKubeSecretReferences:
    - secretName: volsync-ashi-data
      secretNamespace: ashi
      creationPolicy: Orphan
      template:
        data:
          RESTIC_REPOSITORY: "s3:{{ .endpoint.Value }}/{{ .bucket.Value }}/volsync/ashi/ashi-data"
          RESTIC_PASSWORD: "{{ .repoPassword.Value }}"
          AWS_ACCESS_KEY_ID: "{{ .accessKeyId.Value }}"
          AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey.Value }}"
          AWS_DEFAULT_REGION: auto
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ashi-data
  namespace: ashi
spec:
  sourcePVC: ashi-data
  trigger:
    schedule: "0 19 * * *"
  restic:
    repository: volsync-ashi-data
    copyMethod: Snapshot
    retain: { daily: 7, weekly: 4, monthly: 6 }
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
---
# 戻す側(populator)。PVC ashi-data の dataSourceRef がこれを指すので、PVC を新しく作ると R2 の最新から中身を埋めてから渡す
# (入れ直したクラスタ・PVC を消して作り直したとき)。今ある PVC には効かない。作られたときに 1 回だけ戻す
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: ashi-data-dst
  namespace: ashi
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-ashi-data
    copyMethod: Snapshot
    capacity: 2Gi
    accessModes: [ReadWriteOnce]
    storageClassName: local-path
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
    # 戻した中身はスナップショットに残るので、作業用の PVC は消す
    cleanupTempPVC: true
    cleanupCachePVC: true
